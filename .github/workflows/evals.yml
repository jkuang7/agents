name: evals

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest evals/test_skills.py evals/test_deploy.py evals/test_wizard.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
